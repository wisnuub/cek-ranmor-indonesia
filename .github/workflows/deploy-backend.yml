name: Deploy Backend → Render

on:
  push:
    branches: [master]
    paths: ["backend/**", "render.yaml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Trigger Render deploy

    steps:
      - name: Trigger Render deploy hook
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
